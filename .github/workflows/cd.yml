name: Entrega Continua

on:
  release:
    types: [published]

jobs:
  entrega:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python y validar pruebas
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar y probar antes de empaquetar
        run: |
          pip install -r requirements.txt
          pytest -v

      - name: Preparar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-v1
          path: |
            app.py
            requirements.txt
            Procfile
            templates/
            static/